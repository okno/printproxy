# Printproxy configuration. Syntax is strict KEY=VALUE; this is not a shell script.

# Transparent full-duplex RAW/JetDirect. Both byte streams remain live for the
# complete TCP session; printer status bytes are relayed without interpretation.
PROXY_PROTOCOL=raw
DELIVERY_MODE=transparent_duplex

# Dedicated virtual service address and real printer destination.
LISTEN_IP=10.1.2.220
LISTEN_PORT=9100
PRINTER_IP=10.1.2.200
PRINTER_PORT=9100

# The installer detects the route interface when set to auto. It never changes
# the primary address, gateway, subnet or global forwarding configuration.
NETWORK_INTERFACE=auto
VIRTUAL_PREFIX=24

# Durable archive, operational spool, and ordinary logs are deliberately split.
DATA_DIR=/var/lib/printproxy/jobs
SPOOL_DIR=/var/lib/printproxy/spool
LOG_DIR=/var/log/printproxy

# RAW TCP has no universal job delimiter. hybrid seals a non-empty segment at
# either clean connection close or a calibrated idle gap. CUT splitting is off
# because GS V can be absent, repeated, or occur inside binary payloads.
JOB_END_MODE=hybrid
IDLE_TIMEOUT=3
INITIAL_DATA_TIMEOUT=15
SESSION_IDLE_TIMEOUT=300
MAX_JOB_DURATION=300
SPLIT_ON_ESCPOS_CUT=no

CONNECT_TIMEOUT=5
FORWARD_TIMEOUT=30
# Access to the single physical printer is exclusive. A concurrent live client
# is reset immediately instead of being delayed and printed after its timeout.
MAX_SESSION_DURATION=900
# After a client half-close, keep relaying printer responses until printer FIN
# or this response-idle timeout. This does not delimit persistent live sessions.
PRINTER_RESPONSE_TIMEOUT=5
CHUNK_SIZE=65536
MAX_JOB_BYTES=67108864
MAX_CONCURRENT_CLIENTS=32
MAX_CONCURRENT_SIDECARS=2
FSYNC_INTERVAL_BYTES=262144
SHUTDOWN_GRACE_SECONDS=20

# Response capture is metadata-only and bounded. Relaying itself is never
# truncated. Hexdump logging is disabled by default because receipts may carry
# personal or business data.
MAX_PRINTER_RESPONSE_CAPTURE_BYTES=65536
DEBUG_HEXDUMP=no
DEBUG_HEXDUMP_MAX_BYTES=256

ENABLE_READABLE_DUMP=yes
MAX_READABLE_DUMP_BYTES=1048576
SAVE_CLEAN_TXT=yes
SAVE_PDF=yes
PDF_WIDTH_MM=80
ENABLE_HEX_DUMP=no
DEFAULT_CODEPAGE=cp858

HASH_ALGORITHM=sha256
ENABLE_HASH_CHAIN=yes
ENABLE_HMAC=yes
HMAC_KEY_FILE=/etc/printproxy/integrity.key
HMAC_CREDENTIAL_NAME=integrity.key

MIN_FREE_DISK_MB=1024
EMERGENCY_RESERVE_MB=16

# Set ALLOWED_CLIENTS to the exact management-system IP(s) when known. An exact
# client match or membership in ALLOWED_NETWORKS is sufficient. Never leave both
# empty. The application ACL is always enforced; nftables is optional defense in
# depth and uses a dedicated table only.
ALLOWED_NETWORKS=10.1.2.0/24
ALLOWED_CLIENTS=
ENABLE_FIREWALL=no

# Only failures known to occur before the durable SENDING marker are retried.
# UNKNOWN_PRINT_STATE always requires an explicit operator confirmation.
AUTO_RETRY_BEFORE_SEND=yes
RETRY_INITIAL_SECONDS=5
RETRY_MAX_SECONDS=300
RETRY_JITTER_PERCENT=20
PRESERVE_QUEUE_ORDER=yes
BLOCK_QUEUE_ON_UNKNOWN=no
REQUEST_POLL_SECONDS=2

# Disabled by default: print archives are never deleted unless explicitly enabled.
ENABLE_RETENTION=no
RETENTION_DAYS=365
RETENTION_CHECK_SECONDS=86400

ENABLE_FILE_LOG=yes
